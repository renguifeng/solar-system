<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系 3D 动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            line-height: 1.8;
        }

        .info h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            color: white;
        }

        .control-panel h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #ffd700;
        }

        .switch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .switch-item:last-child {
            margin-bottom: 0;
        }

        /* 开关样式 */
        .switch {
            position: relative;
            width: 44px;
            height: 22px;
            margin-left: 15px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🌌 太阳系 3D 动画</h1>
        <p>使用 Three.js 创建的太阳系模拟</p>
    </div>

    <div class="control-panel">
        <h3>⚙️ 显示控制</h3>
        <div class="switch-item">
            <span>🏷️ 标签</span>
            <label class="switch">
                <input type="checkbox" id="toggle-labels" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>🔄 轨道</span>
            <label class="switch">
                <input type="checkbox" id="toggle-orbits" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="controls-hint">
        🖱️ 左键拖动旋转 | 右键拖动平移 | 滚轮缩放
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
