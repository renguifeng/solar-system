<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系 3D 动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            line-height: 1.8;
        }

        .info h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🌌 太阳系 3D 动画</h1>
        <p>使用 Three.js 创建的太阳系模拟</p>
    </div>
    <div class="controls-hint">
        🖱️ 左键拖动旋转 | 右键拖动平移 | 滚轮缩放
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
